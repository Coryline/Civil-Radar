<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civil Radar</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    #panel {
      position: absolute; top: 20px; left: 20px; width: 320px; z-index: 2;
      background: rgba(255,255,255,0.92); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 15px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Civil Radar</h1>
    <p>Live grassroots protest map</p>
    <input id="location" placeholder="Enter your location" />
  </div>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'YOUR_MAPBOX_TOKEN';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-98.5795, 39.8283],
      zoom: 3
    });

    fetch('/api/protests')
      .then((res) => res.json())
      .then((items) => {
        for (const event of items) {
          if (event.latitude && event.longitude) {
            const marker = new mapboxgl.Marker({ color: '#ff4d4d' })
              .setLngLat([event.longitude, event.latitude])
              .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`
                <strong>${event.cause}</strong><br/>
                ${event.location_name || 'Unknown location'}<br/>
                <a href="/api/protests/${event.id}" target="_blank">View details</a>
              `))
              .addTo(map);
          }
        }
      });

    document.getElementById('location').addEventListener('change', async (event) => {
      const value = event.target.value;
      if (!value) return;
      const response = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(value)}.json?access_token=${mapboxgl.accessToken}`);
      const data = await response.json();
      const feature = data.features[0];
      if (feature) {
        const [lng, lat] = feature.center;
        map.flyTo({ center: [lng, lat], zoom: 10 });
      }
    });
  </script>
</body>
</html>

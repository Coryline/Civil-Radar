<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civil Radar</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
      body { display: flex; }
      #sidebar {
        width: 360px; background: #111827; color: white; padding: 18px; box-sizing: border-box;
        overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.2);
      }
      #map { flex: 1; height: 100vh; }
      .event {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 12px;
      }
      .event h3 { margin: 0 0 8px 0; font-size: 1rem; }
      .badge { display: inline-block; background: #ef4444; color: white; padding: 4px 8px; border-radius: 999px; font-size: 11px; margin-bottom: 8px; }
      input {
        width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-top: 12px;
      }
      a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h1 style="margin-top:0;">Civil Radar</h1>
      <div class="badge">LIVE GRASSROOTS FEED</div>
      <input id="locationInput" placeholder="Enter your location" />
      <div id="eventList" style="margin-top: 18px;"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map('map').setView([39.8283, -98.5795], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      const eventList = document.getElementById('eventList');
      const locationInput = document.getElementById('locationInput');

      function renderEvents(events) {
        eventList.innerHTML = '';
        events.forEach((event) => {
          const div = document.createElement('div');
          div.className = 'event';
          div.innerHTML = `
            <h3>${event.cause || 'General action'}</h3>
            <div class="badge">${event.status || 'active'}</div>
            <div><strong>Location:</strong> ${event.location_name || 'Unknown'}</div>
            <div><strong>Address:</strong> ${event.full_address || 'Not specified'}</div>
            <div><strong>Starts:</strong> ${event.start_time ? new Date(event.start_time).toLocaleString() : 'TBD'}</div>
            <div style="margin-top:8px;"><a href="#" onclick="focusEvent(${event.latitude}, ${event.longitude}); return false;">View on map</a></div>
          `;
          eventList.appendChild(div);
        });
      }

      function focusEvent(lat, lng) {
        map.setView([lat, lng], 12);
      }

      async function fetchEvents() {
        const response = await fetch('/api/protests');
        const events = await response.json();
        renderEvents(events);

        events.forEach((event) => {
          if (event.latitude && event.longitude) {
            const marker = L.marker([event.latitude, event.longitude]).addTo(map);
            marker.bindPopup(`<strong>${event.cause}</strong><br>${event.location_name}<br>${event.full_address || ''}`);
          }
        });
      }

      locationInput.addEventListener('change', async (event) => {
        const query = event.target.value;
        if (!query) return;
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
          const data = await response.json();
          if (data && data[0]) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            map.setView([lat, lon], 11);
          }
        } catch (err) {
          console.error('Location lookup failed', err);
        }
      });

      fetchEvents();
    </script>
  </body>
</html>
